<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Winless</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="config.js"></script>
<style>
  :root {
    --bg:        #0b0e13;   /* stadium at night */
    --panel:     #131820;
    --panel-2:   #1a2029;
    --line:      #262e3a;
    --ink:       #eef2f7;
    --ink-dim:   #8b97a8;
    --ink-faint: #5a6472;
    --alert:     #ff4d3d;   /* single alert accent — losing team red */
    --alert-dim: #b8352a;
    --live:      #35d07f;    /* submitted / alive */
    --gold:      #f5c451;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }

  body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,77,61,0.08), transparent 60%);
    padding: 0 20px 80px;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  /* ---- Masthead ---- */
  header {
    padding: 34px 0 26px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 0.14em;
    line-height: 0.9;
    text-transform: uppercase;
  }
  .brand .x { color: var(--alert); }
  .tagline {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 6px;
  }
  .whoami {
    text-align: right;
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.5;
  }
  .whoami b { color: var(--ink); font-weight: 600; }
  .whoami a {
    color: var(--ink-faint);
    text-decoration: none;
    border-bottom: 1px dashed var(--ink-faint);
    cursor: pointer;
    font-size: 11px;
  }
  .whoami a:hover { color: var(--alert); border-color: var(--alert); }

  /* ---- Name select ---- */
  .gate { padding-top: 60px; text-align: center; }
  .gate h2 {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 24px;
    font-weight: 600;
  }
  .name-grid {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .name-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 22px 40px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .12s, border-color .12s, background .12s;
  }
  .name-btn:hover {
    border-color: var(--alert);
    background: var(--panel-2);
    transform: translateY(-2px);
  }

  /* ---- Week header ---- */
  .weekbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 22px;
  }
  .weekbar .wk {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .stat {
    text-align: center;
    padding: 0 4px;
  }
  .stat .num {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--alert);
    line-height: 1;
  }
  .stat .lbl {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .weekbar .stats { display: flex; gap: 22px; }

  /* ---- Submission tracker ---- */
  .tracker {
    display: flex;
    gap: 10px;
    margin-bottom: 26px;
  }
  .chip {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    font-family: 'Barlow Semi Condensed', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .chip .nm { font-size: 16px; font-weight: 600; }
  .chip .st { font-size: 10px; letter-spacing: 0.14em; margin-top: 3px; color: var(--ink-faint); }
  .chip.in { border-color: var(--live); }
  .chip.in .st { color: var(--live); }
  .chip.wait .st { color: var(--gold); }

  /* ---- Pick builder ---- */
  .section-title {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 12px 2px;
    font-weight: 600;
  }
  .hint { font-size: 12px; color: var(--ink-faint); margin: 0 0 18px 2px; line-height: 1.5; }

  .rank-list { display: flex; flex-direction: column; gap: 8px; }
  .slot {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .slot .rk {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink-faint);
    width: 34px;
    text-align: center;
    flex-shrink: 0;
  }
  .slot:first-child .rk { color: var(--alert); }
  .slot .pts {
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    width: 44px;
    flex-shrink: 0;
    text-align: right;
  }
  select.team {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  select.team:focus { outline: none; border-color: var(--alert); }
  select.team.empty { color: var(--ink-faint); }

  .submitbar { margin-top: 26px; display: flex; gap: 12px; align-items: center; }
  .btn {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 15px 30px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: transform .1s, background .12s;
  }
  .btn-primary { background: var(--alert); color: #fff; }
  .btn-primary:hover { background: #ff6152; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--panel-2); color: var(--ink-faint); cursor: not-allowed; transform: none; }
  .msg { font-size: 13px; color: var(--ink-dim); }
  .msg.ok { color: var(--live); }
  .msg.err { color: var(--alert); }

  .locked-note {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--live);
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 14px;
    color: var(--ink-dim);
    line-height: 1.55;
  }
  .locked-note b { color: var(--ink); }

  .setup-warn {
    background: rgba(255,77,61,0.08);
    border: 1px solid var(--alert-dim);
    border-radius: 10px;
    padding: 18px 20px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    margin-top: 40px;
  }
  .setup-warn code { background: var(--panel-2); padding: 2px 6px; border-radius: 4px; font-size: 13px; }

  .center-msg { text-align: center; color: var(--ink-dim); padding: 60px 0; font-size: 14px; }

  /* ---- Lock button ---- */
  .lockbar {
    margin: 22px 0 4px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .lockbar .lbltxt { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .lockbar .lbltxt b { color: var(--ink); }
  .btn-lock { background: var(--gold); color: #1a1200; white-space: nowrap; }
  .btn-lock:hover { background: #ffd166; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--line); color: var(--ink-dim);
    font-size: 12px; padding: 9px 16px; letter-spacing: 0.08em;
  }
  .btn-ghost:hover { border-color: var(--alert); color: var(--alert); }

  /* ---- Layout: board + ranking ---- */
  .reveal-grid {
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 640px) {
    .reveal-grid { grid-template-columns: 1fr; }
  }

  /* ---- Aggregate ranking (standings table) ---- */
  .ranking {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    position: sticky;
    top: 16px;
  }
  .ranking h3 {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-dim); font-weight: 600;
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .rank-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row .pos {
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700;
    color: var(--ink-faint); width: 20px; font-size: 13px;
  }
  .rank-row.top6 .pos { color: var(--alert); }
  .rank-row .tm { flex: 1; font-weight: 600; }
  .rank-row .tm small { display:block; font-weight:400; color: var(--ink-faint); font-size: 11px; margin-top: 1px; }
  .rank-row .tp {
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700;
    font-size: 16px; color: var(--ink);
  }
  .rank-row .tp small { font-size: 10px; color: var(--ink-faint); font-weight: 400; }
  .rank-divider {
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint); text-align: center; padding: 5px;
    background: var(--panel-2); border-bottom: 1px solid var(--line);
  }

  /* ---- Entry board ---- */
  .board { display: flex; flex-direction: column; gap: 10px; }
  .entry-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .entry-card.dead { opacity: 0.5; }
  .entry-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .entry-head .id {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .entry-head .status-tag {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 20px; font-weight: 600;
  }
  .status-tag.alive { background: rgba(53,208,127,0.14); color: var(--live); }
  .status-tag.dead  { background: rgba(255,77,61,0.14); color: var(--alert); }
  .entry-assign { display: flex; align-items: center; gap: 10px; }
  select.entry-team {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--ink); font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500;
    padding: 9px 10px; border-radius: 8px; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  select.entry-team:focus { outline: none; border-color: var(--alert); }
  select.entry-team.unset { color: var(--ink-faint); }
  select.entry-team option:disabled { color: var(--ink-faint); }
  .entry-used {
    margin-top: 9px; font-size: 11px; color: var(--ink-faint); line-height: 1.5;
  }
  .entry-used b { color: var(--ink-dim); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; }
  .used-pill {
    display: inline-block; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 6px; margin: 2px 3px 0 0; color: var(--ink-dim); font-size: 11px;
  }
  .board-actions { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">WINLE<span class="x">SS</span></div>
      <div class="tagline">NFL Loser Pool — one crew, six entries</div>
    </div>
    <div class="whoami" id="whoami"></div>
  </header>

  <main id="app"><div class="center-msg">Loading…</div></main>
</div>

<script>
// ============================================================
//  Winless — steps 1 & 2: name select + pick submission
// ============================================================

const CFG = window.WINLESS_CONFIG || {};
const SB_URL = (CFG.SUPABASE_URL || "").replace(/\/$/, "");
const SB_KEY = CFG.SUPABASE_ANON_KEY || "";
const CONFIGURED = SB_URL && SB_KEY && !SB_URL.includes("PASTE_") && !SB_KEY.includes("PASTE_");

// NFL teams — abbrev + display
const TEAMS = [
  ["ARI","Arizona Cardinals"],["ATL","Atlanta Falcons"],["BAL","Baltimore Ravens"],
  ["BUF","Buffalo Bills"],["CAR","Carolina Panthers"],["CHI","Chicago Bears"],
  ["CIN","Cincinnati Bengals"],["CLE","Cleveland Browns"],["DAL","Dallas Cowboys"],
  ["DEN","Denver Broncos"],["DET","Detroit Lions"],["GB","Green Bay Packers"],
  ["HOU","Houston Texans"],["IND","Indianapolis Colts"],["JAX","Jacksonville Jaguars"],
  ["KC","Kansas City Chiefs"],["LV","Las Vegas Raiders"],["LAC","Los Angeles Chargers"],
  ["LAR","Los Angeles Rams"],["MIA","Miami Dolphins"],["MIN","Minnesota Vikings"],
  ["NE","New England Patriots"],["NO","New Orleans Saints"],["NYG","New York Giants"],
  ["NYJ","New York Jets"],["PHI","Philadelphia Eagles"],["PIT","Pittsburgh Steelers"],
  ["SF","San Francisco 49ers"],["SEA","Seattle Seahawks"],["TB","Tampa Bay Buccaneers"],
  ["TEN","Tennessee Titans"],["WAS","Washington Commanders"],
];
const TEAM_NAME = Object.fromEntries(TEAMS.map(t => [t[0], t[1]]));

// ---- Supabase REST helpers ----
async function sb(path, opts = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      "Content-Type": "application/json",
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`${res.status}: ${body}`);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
const sbGet = (path) => sb(path, { method: "GET" });
const sbUpsert = (table, rows, onConflict) =>
  sb(`${table}${onConflict ? `?on_conflict=${onConflict}` : ""}`, {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(rows),
  });

// ---- State ----
let ME = localStorage.getItem("winless_player") || null;
let PLAYERS = [];

const app = document.getElementById("app");
const whoami = document.getElementById("whoami");

function renderWhoami() {
  if (ME && PLAYERS.length) {
    const p = PLAYERS.find(x => x.id === ME);
    whoami.innerHTML = `Signed in as <b>${p ? p.name : ME}</b><br><a id="switch">switch player</a>`;
    document.getElementById("switch").onclick = () => {
      localStorage.removeItem("winless_player");
      ME = null;
      boot();
    };
  } else {
    whoami.innerHTML = "";
  }
}

// ---- Name select gate ----
function renderGate() {
  renderWhoami();
  app.innerHTML = `
    <div class="gate">
      <h2>Who's picking?</h2>
      <div class="name-grid">
        ${PLAYERS.map(p => `<button class="name-btn" data-id="${p.id}">${p.name}</button>`).join("")}
      </div>
    </div>`;
  app.querySelectorAll(".name-btn").forEach(btn => {
    btn.onclick = () => {
      ME = btn.dataset.id;
      localStorage.setItem("winless_player", ME);
      boot();
    };
  });
}

// ---- Pick submission screen ----
async function renderWeek() {
  renderWhoami();

  // current open week = highest week_number with status 'open', else highest overall
  const weeks = await sbGet("weeks?order=week_number.desc&limit=1");
  if (!weeks || !weeks.length) {
    app.innerHTML = `<div class="center-msg">No week has been opened yet.<br>
      The commissioner needs to add a row to <b>weeks</b> to start.</div>`;
    return;
  }
  const wk = weeks[0];
  const picksReq = wk.picks_required;

  // existing submission + picks for me this week
  const [subs, myPicks] = await Promise.all([
    sbGet(`submissions?week_number=eq.${wk.week_number}`),
    sbGet(`picks?week_number=eq.${wk.week_number}&player_id=eq.${ME}&order=rank.asc`),
  ]);

  const submittedBy = new Set(subs.filter(s => s.submitted).map(s => s.player_id));
  const iSubmitted = submittedBy.has(ME);
  const allIn = PLAYERS.length > 0 && PLAYERS.every(p => submittedBy.has(p.id));

  // week stat bar + tracker
  const trackerHtml = PLAYERS.map(p => {
    const inYet = submittedBy.has(p.id);
    return `<div class="chip ${inYet ? "in" : "wait"}">
        <div class="nm">${p.name}</div>
        <div class="st">${inYet ? "✓ In" : "Waiting"}</div>
      </div>`;
  }).join("");

  const headerHtml = `
    <div class="weekbar">
      <div class="wk">Week ${wk.week_number}</div>
      <div class="stats">
        <div class="stat"><div class="num">${wk.entries_remaining}</div><div class="lbl">Entries</div></div>
        <div class="stat"><div class="num">${picksReq}</div><div class="lbl">Picks Each</div></div>
      </div>
    </div>
    <div class="tracker">${trackerHtml}</div>`;

  if (wk.status === "locked" || wk.status === "resolved") {
    await renderBoard(wk, headerHtml);
    return;
  }

  // build the ranked slots, pre-filled if I already have picks
  const existing = {};
  myPicks.forEach(p => { existing[p.rank] = p.team; });

  let slots = "";
  for (let r = 1; r <= picksReq; r++) {
    const pts = picksReq - r + 1;
    const chosen = existing[r] || "";
    const opts = [`<option value="" ${chosen ? "" : "selected"}>— pick a team —</option>`]
      .concat(TEAMS.map(([ab, nm]) =>
        `<option value="${ab}" ${chosen === ab ? "selected" : ""}>${nm}</option>`)).join("");
    slots += `
      <div class="slot">
        <div class="rk">${r}</div>
        <select class="team ${chosen ? "" : "empty"}" data-rank="${r}">${opts}</select>
        <div class="pts">${pts} pt${pts !== 1 ? "s" : ""}</div>
      </div>`;
  }

  app.innerHTML = headerHtml + `
    <div class="section-title">Your ranked losers — most confident at the top</div>
    <p class="hint">Pick ${picksReq} different teams you think will lose this week, ranked by confidence.
      Rank 1 is worth ${picksReq} points, down to 1 point at the bottom. Your points get summed with
      Tyler's and Kurt's to build the master ranking${iSubmitted ? " — resubmit any time before lock to change your list." : "."}</p>
    <div class="rank-list">${slots}</div>
    <div class="submitbar">
      <button class="btn btn-primary" id="submit">${iSubmitted ? "Update my list" : "Submit my list"}</button>
      <span class="msg" id="msg"></span>
    </div>
    ${allIn ? `
      <div class="lockbar">
        <div class="lbltxt"><b>All three lists are in.</b> Lock the week to reveal the master
          ranking and start placing entries. Once locked, picks are final.</div>
        <button class="btn btn-lock" id="lockweek">Lock week &amp; reveal</button>
      </div>` : ""}`;

  // prevent picking the same team twice — live dedupe styling
  const selects = () => Array.from(app.querySelectorAll("select.team"));
  function refreshDupes() {
    const chosen = selects().map(s => s.value).filter(Boolean);
    const counts = {};
    chosen.forEach(v => counts[v] = (counts[v] || 0) + 1);
    selects().forEach(s => {
      s.classList.toggle("empty", !s.value);
      s.style.borderColor = (s.value && counts[s.value] > 1) ? "var(--alert)" : "";
    });
  }
  selects().forEach(s => s.onchange = refreshDupes);
  refreshDupes();

  document.getElementById("submit").onclick = () => submitPicks(wk, picksReq);
  const lockBtn = document.getElementById("lockweek");
  if (lockBtn) lockBtn.onclick = () => lockWeek(wk);
}

async function submitPicks(wk, picksReq) {
  const msg = document.getElementById("msg");
  msg.className = "msg";
  msg.textContent = "";

  const selects = Array.from(app.querySelectorAll("select.team"));
  const chosen = selects.map(s => ({ rank: +s.dataset.rank, team: s.value }));

  // validate
  const empties = chosen.filter(c => !c.team);
  if (empties.length) {
    msg.className = "msg err";
    msg.textContent = `Fill all ${picksReq} slots — ${empties.length} still empty.`;
    return;
  }
  const teams = chosen.map(c => c.team);
  if (new Set(teams).size !== teams.length) {
    msg.className = "msg err";
    msg.textContent = "No repeats — each slot needs a different team.";
    return;
  }

  const btn = document.getElementById("submit");
  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "Saving…";

  try {
    // clear my existing picks for this week, then insert fresh
    await sb(`picks?week_number=eq.${wk.week_number}&player_id=eq.${ME}`, { method: "DELETE" });
    const rows = chosen.map(c => ({
      week_number: wk.week_number, player_id: ME, team: c.team, rank: c.rank,
    }));
    await sb("picks", { method: "POST", body: JSON.stringify(rows) });
    await sbUpsert("submissions",
      [{ week_number: wk.week_number, player_id: ME, submitted: true }],
      "week_number,player_id");

    msg.className = "msg ok";
    msg.textContent = "Locked in ✓";
    setTimeout(renderWeek, 700);
  } catch (e) {
    btn.disabled = false;
    msg.className = "msg err";
    msg.textContent = "Save failed: " + e.message;
  }
}

// ---- Lock the week ----
async function lockWeek(wk) {
  const btn = document.getElementById("lockweek");
  if (btn) { btn.disabled = true; btn.textContent = "Locking…"; }
  try {
    await sb(`weeks?week_number=eq.${wk.week_number}`, {
      method: "PATCH", body: JSON.stringify({ status: "locked" }),
    });
    renderWeek();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Lock week & reveal"; }
    alert("Couldn't lock: " + e.message);
  }
}

// ---- Compute aggregate ranking from all picks this week ----
// team -> { points, voters:[{player,rank,pts}] }.  rank r on a list of N = (N - r + 1) points.
function computeAggregate(allPicks, picksReq) {
  const map = {};
  allPicks.forEach(p => {
    const pts = picksReq - p.rank + 1;
    if (!map[p.team]) map[p.team] = { team: p.team, points: 0, voters: [] };
    map[p.team].points += pts;
    map[p.team].voters.push({ player: p.player_id, rank: p.rank, pts });
  });
  return Object.values(map).sort((a, b) =>
    b.points - a.points || a.team.localeCompare(b.team));
}

// ---- Reveal + entry board ----
async function renderBoard(wk, headerHtml) {
  const [allPicks, entries, assigns] = await Promise.all([
    sbGet(`picks?week_number=eq.${wk.week_number}`),
    sbGet(`entries?order=id.asc`),
    sbGet(`assignments?order=week_number.asc`),
  ]);

  const agg = computeAggregate(allPicks, wk.picks_required);
  const aggRank = {}; agg.forEach((a, i) => aggRank[a.team] = i + 1);

  // per-entry used teams = every team this entry was assigned in PRIOR weeks
  const usedByEntry = {};
  entries.forEach(e => usedByEntry[e.id] = new Set());
  assigns.forEach(a => {
    if (a.week_number < wk.week_number) usedByEntry[a.entry_id]?.add(a.team);
  });

  // this week's existing assignments (to prefill the board)
  const thisWeek = {};
  assigns.filter(a => a.week_number === wk.week_number)
         .forEach(a => thisWeek[a.entry_id] = a.team);

  const playerName = id => (PLAYERS.find(p => p.id === id)?.name || id);

  // ranking panel
  let rankRows = "";
  agg.forEach((a, i) => {
    if (i === 6) rankRows += `<div class="rank-divider">— cutline —</div>`;
    const voters = a.voters
      .sort((x, y) => x.rank - y.rank)
      .map(v => `${playerName(v.player)} #${v.rank}`).join(" · ");
    rankRows += `
      <div class="rank-row ${i < 6 ? "top6" : ""}">
        <div class="pos">${i + 1}</div>
        <div class="tm">${TEAM_NAME[a.team] || a.team}<small>${voters}</small></div>
        <div class="tp">${a.points}<small> pt</small></div>
      </div>`;
  });
  if (!agg.length) rankRows = `<div class="rank-row"><div class="tm" style="color:var(--ink-faint)">No picks submitted.</div></div>`;

  const rankingHtml = `
    <div class="ranking">
      <h3>Master Ranking</h3>
      ${rankRows}
    </div>`;

  // team dropdown options for an entry — disable teams this entry already used
  function teamOptions(entryId, selected) {
    const used = usedByEntry[entryId] || new Set();
    const opts = [`<option value="" ${selected ? "" : "selected"}>— assign a team —</option>`];
    // sort by aggregate rank so best picks float to the top of the list
    const ordered = [...TEAMS].sort((a, b) =>
      (aggRank[a[0]] || 99) - (aggRank[b[0]] || 99) || a[1].localeCompare(b[1]));
    ordered.forEach(([ab, nm]) => {
      const isUsed = used.has(ab);
      const rk = aggRank[ab] ? `#${aggRank[ab]}` : "";
      opts.push(`<option value="${ab}" ${selected === ab ? "selected" : ""} ${isUsed ? "disabled" : ""}>
        ${nm}${rk ? "  " + rk : ""}${isUsed ? "  (used)" : ""}</option>`);
    });
    return opts.join("");
  }

  // board of entries
  let boardHtml = "";
  entries.forEach(e => {
    const dead = e.status === "dead";
    const used = [...(usedByEntry[e.id] || [])];
    const sel = thisWeek[e.id] || "";
    boardHtml += `
      <div class="entry-card ${dead ? "dead" : ""}">
        <div class="entry-head">
          <div class="id">${e.label || "Entry " + e.id}</div>
          <div class="status-tag ${dead ? "dead" : "alive"}">${dead ? "Eliminated" : "Alive"}</div>
        </div>
        ${dead ? `<div class="entry-used">Knocked out in Week ${e.died_week ?? "?"}.</div>` : `
          <div class="entry-assign">
            <select class="entry-team ${sel ? "" : "unset"}" data-entry="${e.id}">
              ${teamOptions(e.id, sel)}
            </select>
          </div>
          <div class="entry-used">
            <b>Used:</b> ${used.length
              ? used.map(t => `<span class="used-pill">${t}</span>`).join("")
              : `<span style="color:var(--ink-faint)">none yet</span>`}
          </div>`}
      </div>`;
  });

  app.innerHTML = headerHtml + `
    <div class="lockbar" style="margin-bottom:18px">
      <div class="lbltxt"><b>Week ${wk.week_number} locked.</b> Place teams on the live entries below.
        A team can go on more than one entry; an entry can't reuse a team it already played.</div>
      <button class="btn btn-ghost" id="unlock">Unlock</button>
    </div>
    <div class="reveal-grid">
      <div>
        <div class="section-title">Entry Board</div>
        <div class="board">${boardHtml}</div>
        <div class="board-actions">
          <button class="btn btn-primary" id="saveboard">Save assignments</button>
          <span class="msg" id="boardmsg"></span>
        </div>
      </div>
      ${rankingHtml}
    </div>`;

  app.querySelectorAll("select.entry-team").forEach(s => {
    s.onchange = () => s.classList.toggle("unset", !s.value);
  });
  document.getElementById("saveboard").onclick = () => saveBoard(wk);
  document.getElementById("unlock").onclick = async () => {
    if (!confirm("Unlock the week? This lets everyone edit their lists again.")) return;
    await sb(`weeks?week_number=eq.${wk.week_number}`, {
      method: "PATCH", body: JSON.stringify({ status: "open" }),
    });
    renderWeek();
  };
}

async function saveBoard(wk) {
  const msg = document.getElementById("boardmsg");
  msg.className = "msg"; msg.textContent = "Saving…";
  const btn = document.getElementById("saveboard");
  btn.disabled = true;

  const rows = Array.from(app.querySelectorAll("select.entry-team"))
    .filter(s => s.value)
    .map(s => ({
      week_number: wk.week_number,
      entry_id: +s.dataset.entry,
      team: s.value,
      result: "pending",
    }));

  try {
    // clear this week's assignments, then insert the current board
    await sb(`assignments?week_number=eq.${wk.week_number}`, { method: "DELETE" });
    if (rows.length) await sb("assignments", { method: "POST", body: JSON.stringify(rows) });
    msg.className = "msg ok"; msg.textContent = "Assignments saved ✓";
    btn.disabled = false;
  } catch (e) {
    btn.disabled = false;
    msg.className = "msg err"; msg.textContent = "Save failed: " + e.message;
  }
}

// ---- Boot ----
async function boot() {
  if (!CONFIGURED) {
    whoami.innerHTML = "";
    app.innerHTML = `
      <div class="setup-warn">
        <b>Almost there.</b> Open <code>config.js</code> and paste your Supabase
        <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code>, then redeploy.
        Until then the app can't reach the backend.
      </div>`;
    return;
  }
  try {
    PLAYERS = await sbGet("players?order=id.asc");
  } catch (e) {
    app.innerHTML = `<div class="setup-warn"><b>Couldn't reach Supabase.</b><br>${e.message}
      <br><br>Check your URL and anon key in <code>config.js</code>, and that the RLS policies ran.</div>`;
    return;
  }
  if (!ME || !PLAYERS.find(p => p.id === ME)) {
    renderGate();
  } else {
    app.innerHTML = `<div class="center-msg">Loading week…</div>`;
    renderWeek();
  }
}

boot();
</script>
