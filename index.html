const COMMISH_PASSWORD = "gopackgo";
const COMMISH_PLAYER = "reid";   // this player gets commish tools without a password

function openCommish() {
  // Reid goes straight in; anyone else must enter the password.
  if (ME === COMMISH_PLAYER) {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `<div class="modal"></div>`;
    document.body.appendChild(overlay);
    overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
    commishTools(overlay);
    return;
  }
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h2>Commissioner</h2>
      <p>Enter the commissioner password to access season tools.</p>
      <input type="password" id="commishpw" placeholder="Password" autocomplete="off" />
      <div class="modal-actions">
        <button class="btn btn-ghost" id="commishcancel">Cancel</button>
        <button class="btn btn-primary" id="commishenter">Enter</button>
      </div>
      <span class="msg" id="commishmsg"></span>
    </div>`;
  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  overlay.querySelector("#commishcancel").onclick = close;
  const pw = overlay.querySelector("#commishpw");
  pw.focus();
  const tryEnter = () => {
    if (pw.value === COMMISH_PASSWORD) commishTools(overlay);
    else {
      const m = overlay.querySelector("#commishmsg");
      m.className = "msg err"; m.textContent = "Wrong password.";
    }
  };
  overlay.querySelector("#commishenter").onclick = tryEnter;
  pw.onkeydown = (e) => { if (e.key === "Enter") tryEnter(); };
}

async function commishTools(overlay) {
  const modal = overlay.querySelector(".modal");
  modal.innerHTML = `<h2>Commissioner</h2><p>Loading season state…</p>`;

  // figure out sensible defaults for the next week
  let weeks = [], entries = [];
  try {
    [weeks, entries] = await Promise.all([
      sbGet("weeks?order=week_number.desc"),
      sbGet("entries?order=id.asc"),
    ]);
  } catch (e) {
    modal.innerHTML = `<h2>Commissioner</h2><p class="msg err">Couldn't load state: ${e.message}</p>
      <div class="modal-actions"><button class="btn btn-ghost" id="c">Close</button></div>`;
    modal.querySelector("#c").onclick = () => overlay.remove();
    return;
  }

  const latest = weeks && weeks.length ? weeks[0] : null;
  const nextWeekNum = latest ? latest.week_number + 1 : 1;
  const aliveCount = (entries || []).filter(e => e.status !== "dead").length || 6;
  const defaultPicks = aliveCount + 2;

  const currentStatusLine = latest
    ? `Latest week: <b>Week ${latest.week_number}</b> (${latest.status}).`
    : `No weeks yet — this will be Week 1.`;

  modal.innerHTML = `
    <h2>Commissioner</h2>
    <p>${currentStatusLine} ${aliveCount} entries still alive.</p>

    <div class="modal-section">
      <h3>Open a week</h3>
      <p>Opens picks for a new week. Picks required defaults to alive entries + 2.
        Everyone can then submit until it's locked.</p>
      <div style="display:flex;gap:10px">
        <div style="flex:1">
          <label style="font-size:11px;color:var(--ink-faint);letter-spacing:0.08em;text-transform:uppercase">Week #</label>
          <input type="number" id="wknum" value="${nextWeekNum}" min="1" />
        </div>
        <div style="flex:1">
          <label style="font-size:11px;color:var(--ink-faint);letter-spacing:0.08em;text-transform:uppercase">Entries left</label>
          <input type="number" id="wkentries" value="${aliveCount}" min="1" max="6" />
        </div>
        <div style="flex:1">
          <label style="font-size:11px;color:var(--ink-faint);letter-spacing:0.08em;text-transform:uppercase">Picks each</label>
          <input type="number" id="wkpicks" value="${defaultPicks}" min="1" />
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="openweek">Open Week ${nextWeekNum}</button>
      </div>
      <span class="msg" id="openmsg"></span>
    </div>

    <div class="modal-section">
      <h3>Reset season</h3>
      <p>Wipes all picks, submissions, assignments, field imports, results, weeks, and peels.
        Players and the six entries stay (entries reset to alive). <b>Can't be undone.</b></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="closetools">Close</button>
        <button class="btn btn-danger" id="resetseason">Reset season</button>
      </div>
      <span class="msg" id="resetmsg"></span>
    </div>`;

  // auto-sync picks default when entries changes
  const entriesInput = modal.querySelector("#wkentries");
  const picksInput = modal.querySelector("#wkpicks");
  entriesInput.oninput = () => {
    const v = parseInt(entriesInput.value, 10);
    if (!isNaN(v)) picksInput.value = v + 2;
  };

  modal.querySelector("#openweek").onclick = async () => {
    const msg = modal.querySelector("#openmsg");
    const wknum = parseInt(modal.querySelector("#wknum").value, 10);
    const wkentries = parseInt(entriesInput.value, 10);
    const wkpicks = parseInt(picksInput.value, 10);
    if (!wknum || !wkentries || !wkpicks) {
      msg.className = "msg err"; msg.textContent = "Fill all three fields."; return;
    }
    const btn = modal.querySelector("#openweek");
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Opening…";
    try {
      // if this week number already exists, update it; else insert
      const existing = weeks.find(w => w.week_number === wknum);
      if (existing) {
        await sb(`weeks?week_number=eq.${wknum}`, {
          method: "PATCH",
          body: JSON.stringify({ entries_remaining: wkentries, picks_required: wkpicks, status: "open" }),
        });
      } else {
        await sb("weeks", {
          method: "POST",
          body: JSON.stringify({ week_number: wknum, entries_remaining: wkentries, picks_required: wkpicks, status: "open" }),
        });
      }
      msg.className = "msg ok"; msg.textContent = `Week ${wknum} is open. Reloading…`;
      BOARD_EDIT_MODE = false; CURRENT_TAB = "week";
      setTimeout(() => { overlay.remove(); boot(); }, 900);
    } catch (e) {
      btn.disabled = false;
      msg.className = "msg err"; msg.textContent = "Failed: " + e.message;
    }
  };

  modal.querySelector("#closetools").onclick = () => overlay.remove();
  modal.querySelector("#resetseason").onclick = async () => {
    if (!confirm("Really wipe the whole season? Picks, weeks, assignments, field data, and results will be deleted. This cannot be undone.")) return;
    const btn = modal.querySelector("#resetseason");
    const msg = modal.querySelector("#resetmsg");
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Resetting…";
    try {
      await sb(`assignments?id=gte.0`, { method: "DELETE" });
      await sb(`picks?id=gte.0`, { method: "DELETE" });
      await sb(`submissions?week_number=gte.0`, { method: "DELETE" });
      await sb(`field_picks?id=gte.0`, { method: "DELETE" });
      await sb(`peels?id=gte.0`, { method: "DELETE" });
      await sb(`tile_values?id=gte.0`, { method: "DELETE" });
      await sb(`pot_ledger?id=gte.0`, { method: "DELETE" }).catch(() => {});
      await sb(`weeks?id=gte.0`, { method: "DELETE" });
      await sb(`entries?id=gte.0`, {
        method: "PATCH", body: JSON.stringify({ status: "alive", died_week: null }),
      });
      msg.className = "msg ok"; msg.textContent = "Season reset. Reloading…";
      BOARD_EDIT_MODE = false;
      setTimeout(() => { overlay.remove(); CURRENT_TAB = "week"; boot(); }, 900);
    } catch (e) {
      btn.disabled = false;
      msg.className = "msg err"; msg.textContent = "Reset failed: " + e.message;
    }
  };
}

// Inline rename of entries on the placed view. Saves to entries.label for everyone.
function wireEntryRename() {
  app.querySelectorAll(".pid-name").forEach(span => {
    span.onclick = () => {
      if (span.querySelector("input")) return; // already editing
      const entryId = span.dataset.entry;
      const current = span.textContent.trim();
      const startsAsDefault = /^Entry \d+$/.test(current);
      const input = document.createElement("input");
      input.type = "text";
      input.value = startsAsDefault ? "" : current;
      input.placeholder = "Name this entry…";
      input.maxLength = 40;
      input.className = "pid-edit";
      span.textContent = "";
      span.appendChild(input);
      input.focus(); input.select();

      let done = false;
      const finish = async (save) => {
        if (done) return; done = true;
        const val = input.value.trim();
        if (save && val && val !== current) {
          try {
            await sb(`entries?id=eq.${entryId}`, {
              method: "PATCH", body: JSON.stringify({ label: val }),
            });
            span.textContent = val;
          } catch (e) {
            span.textContent = current;
            alert("Rename failed: " + e.message);
          }
        } else if (save && !val) {
          // empty = clear back to default
          try {
            await sb(`entries?id=eq.${entryId}`, {
              method: "PATCH", body: JSON.stringify({ label: null }),
            });
            span.textContent = "Entry " + entryId;
          } catch (e) { span.textContent = current; }
        } else {
          span.textContent = current;
        }
      };
      input.onblur = () => finish(true);
      input.onkeydown = (e) => {
        if (e.key === "Enter") { e.preventDefault(); input.blur(); }
        else if (e.key === "Escape") { done = true; span.textContent = current; }
      };
    };
  });
}

// ============================================================
//  WEEKLY AWARD — best weekly record peels a cutout section
// ============================================================
const CUTOUT_IMAGE = "cutout.jpg";   // commit this file next to index.html
const TILE_COUNT = 100;              // 10 x 10
const PEELS_PER_WEEK = 4;            // winner peels this many per week

// Tile types across the 100 tiles.
//  - money:      positive $, both others owe the peeler
//  - jackpot:    big positive $ (one grail tile)
//  - negative:   the peeler owes both others
//  - multiplier: doubles the NEXT peel (good or bad); if it's the last peel, grants 1 bonus peel
const TILE_PLAN = [
  // positive money (~74)
  { type: "money", amount: 0.25, count: 22 },
  { type: "money", amount: 0.50, count: 15 },
  { type: "money", amount: 1.00, count: 14 },
  { type: "money", amount: 2.00, count: 11 },
  { type: "money", amount: 3.00, count: 6 },
  { type: "money", amount: 5.00, count: 4 },
  { type: "money", amount: 10.00, count: 2 },
  // negatives (~13): you owe both others
  { type: "negative", amount: 1.00, count: 7 },
  { type: "negative", amount: 2.00, count: 4 },
  { type: "negative", amount: 3.00, count: 2 },
  // pot tiles (~4): peel it, that $ goes into the season side pot (from the peeler)
  { type: "pot", amount: 1.00, count: 2 },
  { type: "pot", amount: 2.00, count: 1 },
  { type: "pot", amount: 3.00, count: 1 },
  // jackpot (1)
  { type: "jackpot", amount: 25.00, count: 1 },
  // multipliers (~6): x2 the next peel
  { type: "multiplier", amount: 2, count: 6 },
];  // fill remainder with $0.25 money
function generateTileValues() {
  const pool = [];
  TILE_PLAN.forEach(({ type, amount, count }) => {
    for (let i = 0; i < count; i++) pool.push({ type, amount });
  });
  while (pool.length < TILE_COUNT) pool.push({ type: "money", amount: 0.25 });
  pool.length = TILE_COUNT;
  // shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.map((t, tile_index) => ({ tile_index, type: t.type, amount: t.amount }));
}

// Compute the winner of a given week from graded picks.
// Best record (correct) that week; ties broken by confidence points.
function weeklyWinner(picks, week, reqByWeek, firstSubByWeek) {
  const stat = {};
  picks.filter(p => p.week_number === week && p.result && p.result !== "pending")
    .forEach(p => {
      const req = reqByWeek[week] || 8;
      const pts = req - p.rank + 1;
      const s = (stat[p.player_id] ||= { correct: 0, conf: 0, total: 0 });
      s.total++;
      if (p.result === "correct") { s.correct++; s.conf += pts; }
    });
  // first-submission time for this week (earlier = wins ties); missing sorts last
  const subTime = (id) => (firstSubByWeek?.[week]?.[id]) || "9999";
  const ranked = Object.entries(stat)
    .map(([id, s]) => ({ id, ...s, sub: subTime(id) }))
    .sort((a, b) => b.correct - a.correct || b.conf - a.conf || a.sub.localeCompare(b.sub));
  return ranked.length ? ranked[0] : null;
}

async function renderAward() {
  renderWhoami();

  const [picks, weeks, peels, subs] = await Promise.all([
    sbGet(`picks?order=week_number.asc`),
    sbGet(`weeks?order=week_number.asc`),
    sbGet(`peels?order=tile_index.asc`).catch(() => []),
    sbGet(`submissions?order=week_number.asc`).catch(() => []),
  ]);
  const reqByWeek = {}; (weeks || []).forEach(w => reqByWeek[w.week_number] = w.picks_required);
  // first-submission time per week per player: firstSubByWeek[week][player] = iso string
  const firstSubByWeek = {};
  (subs || []).forEach(s => {
    if (!s.first_submitted_at) return;
    (firstSubByWeek[s.week_number] ||= {})[s.player_id] = s.first_submitted_at;
  });

  // load tile dollar values; generate + persist once if the table is empty
  let tileValues = [];
  try {
    tileValues = await sbGet(`tile_values?order=tile_index.asc`) || [];
    if (!tileValues.length) {
      const gen = generateTileValues();
      await sb("tile_values", { method: "POST", body: JSON.stringify(gen) });
      tileValues = gen;
    }
  } catch (e) { tileValues = []; }
  const valueByTile = {}; const typeByTile = {};
  (tileValues || []).forEach(t => { valueByTile[t.tile_index] = Number(t.amount); typeByTile[t.tile_index] = t.type || "money"; });

  // pending multiplier: did the peeler's LAST peel this week reveal an unused multiplier?
  // We track it via the peel records' effective values (multiplier peel stored with effective=0, mult=true).

  // which weeks are fully graded (have at least one non-pending pick)?
  const gradedWeeks = [...new Set((picks || [])
    .filter(p => p.result && p.result !== "pending")
    .map(p => p.week_number))].sort((a, b) => a - b);

  const peeledTiles = new Set((peels || []).map(p => p.tile_index));
  // count peels claimed per week, and multiplier tiles revealed per week (each grants +1 bonus peel)
  const peelsByWeek = {};
  const multsByWeek = {};
  (peels || []).forEach(p => {
    peelsByWeek[p.week_number] = (peelsByWeek[p.week_number] || 0) + 1;
    if (typeByTile[p.tile_index] === "multiplier") multsByWeek[p.week_number] = (multsByWeek[p.week_number] || 0) + 1;
  });

  // find earliest graded week that hasn't used all its peels yet -> award pending
  // budget = base peels + 1 bonus per multiplier revealed that week
  let pendingWeek = null, pendingWinner = null, peelsUsedThisWeek = 0, budgetThisWeek = PEELS_PER_WEEK;
  for (const wk of gradedWeeks) {
    const used = peelsByWeek[wk] || 0;
    const budget = PEELS_PER_WEEK + (multsByWeek[wk] || 0);
    if (used < budget) {
      const w = weeklyWinner(picks, wk, reqByWeek, firstSubByWeek);
      if (w) { pendingWeek = wk; pendingWinner = w; peelsUsedThisWeek = used; budgetThisWeek = budget; break; }
    }
  }
  const peelsLeftThisWeek = pendingWeek ? budgetThisWeek - peelsUsedThisWeek : 0;

  // is there a pending (unused) multiplier for this week? = last peel this week was a multiplier
  const thisWeekPeels = (peels || []).filter(p => p.week_number === pendingWeek)
    .sort((a,b) => (a.created_at||"").localeCompare(b.created_at||""));
  const lastPeel = thisWeekPeels[thisWeekPeels.length - 1];
  const multiplierArmed = lastPeel && typeByTile[lastPeel.tile_index] === "multiplier";

  const iAmWinner = pendingWinner && pendingWinner.id === ME;
  const winnerName = pendingWinner ? (PLAYERS.find(p => p.id === pendingWinner.id)?.name || pendingWinner.id) : null;
  const canPeel = iAmWinner && peeledTiles.size < TILE_COUNT && peelsLeftThisWeek > 0;

  // banner
  let banner = "";
  if (pendingWinner) {
    banner = `
      <div class="winner-banner">
        <div class="wtxt"><b>${winnerName} won Week ${pendingWeek}</b>
          <small>${pendingWinner.correct} correct · ${pendingWinner.conf} confidence — earns ${PEELS_PER_WEEK} peels${peelsUsedThisWeek ? ` (${peelsLeftThisWeek} left)` : ""}</small></div>
        ${canPeel
          ? `<div style="color:var(--gold);font-family:'Barlow Semi Condensed';font-weight:700;letter-spacing:0.1em;text-transform:uppercase;font-size:13px">${multiplierArmed ? "×2 ARMED — next peel doubles!" : `Your peel — pick ${peelsLeftThisWeek === 1 ? "a tile" : peelsLeftThisWeek + " tiles"}`}</div>`
          : iAmWinner
            ? `<div style="color:var(--ink-faint);font-size:12px">Fully revealed</div>`
            : `<div style="color:var(--ink-faint);font-size:12px">Only ${winnerName} can peel</div>`}
      </div>`;
  } else if (peeledTiles.size >= TILE_COUNT) {
    banner = `<div class="winner-banner"><div class="wtxt"><b>Fully revealed.</b>
      <small>Every section has been peeled. Behold.</small></div></div>`;
  } else {
    banner = `<div class="winner-banner"><div class="wtxt"><b>No award pending.</b>
      <small>Once a week's picks are graded, the best record earns ${PEELS_PER_WEEK} peels.</small></div></div>`;
  }

  // tiles
  let tilesHtml = "";
  for (let i = 0; i < TILE_COUNT; i++) {
    const peeled = peeledTiles.has(i);
    const cls = peeled ? "peeled" : (canPeel ? "peelable" : "");
    tilesHtml += `<div class="tile ${cls}" data-tile="${i}"><span class="tnum">${i+1}</span></div>`;
  }

  // log with typed outcomes (uses stored per-peel effective amount when present)
  const labelFor = (p) => {
    const type = typeByTile[p.tile_index] || "money";
    const base = valueByTile[p.tile_index] || 0;
    if (type === "multiplier") return { txt: "×2 multiplier", cls: "var(--gold)" };
    if (type === "pot") return { txt: `🏺 $${base.toFixed(2)} to the pot`, cls: "var(--gold)" };
    // effective is signed per-other-player amount actually owed (may include x2)
    const eff = (p.effective != null) ? Number(p.effective) : (type === "negative" ? -base : base);
    if (eff < 0) return { txt: `−$${Math.abs(eff).toFixed(2)} you owe each`, cls: "var(--alert)" };
    if (type === "jackpot") return { txt: `💰 JACKPOT $${eff.toFixed(2)} each`, cls: "var(--gold)" };
    return { txt: `$${eff.toFixed(2)} from each`, cls: "var(--live)" };
  };
  const logRows = (peels || []).slice().sort((a,b) => (a.created_at||"").localeCompare(b.created_at||""))
    .map(p => {
      const nm = PLAYERS.find(x => x.id === p.player_id)?.name || p.player_id;
      const l = labelFor(p);
      return `<div class="log-row"><span class="who">${nm}</span>
        <span class="when">Week ${p.week_number} · <b style="color:${l.cls}">${l.txt}</b></span></div>`;
    }).join("");

  // total in play = sum of positive effective amounts x2 (rough headline number)
  const totalPot = (peels || []).reduce((s, p) => {
    const type = typeByTile[p.tile_index] || "money";
    if (type === "multiplier") return s;
    const eff = (p.effective != null) ? Number(p.effective) : (type === "negative" ? -(valueByTile[p.tile_index]||0) : (valueByTile[p.tile_index]||0));
    return s + Math.abs(eff) * 2;
  }, 0);

  app.innerHTML = `
    <div class="st-section-title">Weekly Award — peel the cutout</div>
    <p class="award-intro">Each week's best record peels ${PEELS_PER_WEEK} tiles. Tiles hide dollar amounts
      <b>both others owe you</b> ($0.25–$10), plus surprises: <b style="color:var(--alert)">negative tiles</b>
      (you owe both), a <b style="color:var(--gold)">$25 jackpot</b>, and <b style="color:var(--gold)">×2 multipliers</b>
      that double your next peel — good or bad. ${peeledTiles.size} of ${TILE_COUNT} revealed ·
      <b style="color:var(--live)">$${totalPot.toFixed(2)}</b> in motion. Ledger on Standings.</p>
    ${banner}
    <div class="cutout-wrap">
      <img class="cutout-img" src="${CUTOUT_IMAGE}" alt="cutout"
        onerror="this.style.display='none';this.nextElementSibling.nextElementSibling.style.display='flex'">
      <div class="cutout-grid">${tilesHtml}</div>
      <div class="cutout-missing" style="display:none">
        No image yet. Commit a photo named <b>${CUTOUT_IMAGE}</b> next to index.html in your repo,
        and it'll appear here under the tiles.
      </div>
    </div>
    <div class="award-status">${canPeel ? (multiplierArmed ? "×2 is armed — your next tile doubles. Tap a tile." : `Tap ${peelsLeftThisWeek === 1 ? "a covered tile" : "covered tiles"} to peel.`) : ""}</div>
    ${logRows ? `<div class="award-log"><h3>Peel history</h3>${logRows}</div>` : ""}`;

  if (canPeel) {
    const grid = app.querySelector(".cutout-grid");
    if (grid) grid.classList.add("armed");
    app.querySelectorAll(".tile.peelable").forEach(t => {
      const handler = (e) => {
        e.preventDefault();
        peelTile(+t.dataset.tile, pendingWeek, typeByTile, valueByTile, multiplierArmed);
      };
      t.addEventListener("click", handler);
    });
  }
}

async function peelTile(tileIndex, week, typeByTile, valueByTile, multiplierArmed) {
  if (!confirm("Peel this section? Could be money, a negative, the jackpot, or a multiplier — choose deliberately.")) return;
  const type = typeByTile[tileIndex] || "money";
  const base = valueByTile[tileIndex] || 0;
  const mult = multiplierArmed ? 2 : 1;

  // resolve effective signed per-other-player amount
  let effective = 0;
  let potContribution = 0;
  if (type === "money" || type === "jackpot") effective = base * mult;
  else if (type === "negative") effective = -base * mult;
  else if (type === "pot") { effective = 0; potContribution = base * mult; }  // peeler feeds the pot
  else if (type === "multiplier") effective = 0;   // no money; arms next peel

  try {
    await sb("peels", {
      method: "POST",
      body: JSON.stringify({
        tile_index: tileIndex, week_number: week, player_id: ME, effective,
      }),
    });
    // pot tile: record a contribution to the side pot
    if (potContribution > 0) {
      await sb("pot_ledger", {
        method: "POST",
        body: JSON.stringify({
          player_id: ME, amount: potContribution, week_number: week, reason: "pot tile",
        }),
      }).catch(() => {});
    }
    // feedback popup
    setTimeout(() => {
      if (type === "multiplier") {
        alert("✖️2 MULTIPLIER! Your next peel is doubled — good or bad. You get a bonus peel to use it.");
      } else if (type === "pot") {
        alert(`🏺 POT TILE! You drop $${potContribution.toFixed(2)} into the season side pot.${mult>1?" (×2 applied!)":""}`);
      } else if (type === "jackpot") {
        alert(`💰💰 JACKPOT! $${effective.toFixed(2)} from EACH of the others — $${(effective*2).toFixed(2)} total!${mult>1?" (×2 applied!)":""}`);
      } else if (effective < 0) {
        alert(`💀 OUCH — negative tile. You owe EACH of the others $${Math.abs(effective).toFixed(2)} — $${(Math.abs(effective)*2).toFixed(2)} total.${mult>1?" (×2 applied — brutal!)":""}`);
      } else {
        alert(`💰 $${effective.toFixed(2)} from each — $${(effective*2).toFixed(2)} total.${mult>1?" (×2 applied!)":""}`);
      }
    }, 300);
    renderAward();
  } catch (e) {
    alert("Couldn't peel: " + e.message);
  }
}

// Fetch this week's NFL matchups + lines from ESPN and fill the side panel.
async function loadMatchups(week) {
  const panel = document.getElementById("matchups");
  if (!panel) return;
  const body = panel.querySelector(".matchup-loading");
  try {
    const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard`
              + `?seasontype=2&week=${week}&dates=2025`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("ESPN " + res.status);
    const data = await res.json();
    const games = (data.events || []).map(ev => {
      const comp = ev.competitions?.[0];
      if (!comp) return null;
      const cs = comp.competitors || [];
      const home = cs.find(c => c.homeAway === "home");
      const away = cs.find(c => c.homeAway === "away");
      if (!home || !away) return null;
      const odds = comp.odds?.[0];
      // details is like "KC -6.5"; overUnder is a number. Fall back gracefully.
      const line = odds?.details || (odds?.overUnder ? `O/U ${odds.overUnder}` : "—");
      const dt = ev.date ? new Date(ev.date) : null;
      const when = dt ? dt.toLocaleDateString("en-US", { weekday: "short" }) + " " +
        dt.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "";
      return {
        homeAbbr: home.team?.abbreviation, awayAbbr: away.team?.abbreviation,
        homeName: home.team?.shortDisplayName || home.team?.abbreviation,
        awayName: away.team?.shortDisplayName || away.team?.abbreviation,
        line, when, date: dt ? dt.getTime() : 0,
      };
    }).filter(Boolean).sort((a, b) => a.date - b.date);

    if (!games.length) {
      body.outerHTML = `<div class="matchup-empty">No matchups posted yet for Week ${week}.</div>`;
      return;
    }

    const rows = games.map(g => `
      <div class="matchup">
        <div class="mteams">
          <div class="mrow"><span class="mabbr">${g.awayName}</span><span class="mtag">@</span></div>
          <div class="mrow"><span class="mabbr">${g.homeName}</span><span class="mtag home">HOME</span></div>
        </div>
        <div class="mline">
          <div class="mspread">${g.line}</div>
          <div class="mwhen">${g.when}</div>
        </div>
      </div>`).join("");

    body.outerHTML = `<div class="matchup-list">${rows}</div>
      <div class="matchup-note">Lines from ESPN. Negative number = favorite. Bet against the favorite's opponent for a safer "loser."</div>`;
  } catch (e) {
    body.outerHTML = `<div class="matchup-empty">Couldn't load matchups (${e.message}).</div>`;
  }
}

// ---- Boot ----
async function boot() {
  if (!CONFIGURED) {
    whoami.innerHTML = "";
    app.innerHTML = `
      <div class="setup-warn">
        <b>Almost there.</b> Open <code>config.js</code> and paste your Supabase
        <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code>, then redeploy.
        Until then the app can't reach the backend.
      </div>`;
    return;
  }
  try {
    PLAYERS = await sbGet("players?order=id.asc");
  } catch (e) {
    app.innerHTML = `<div class="setup-warn"><b>Couldn't reach Supabase.</b><br>${e.message}
      <br><br>Check your URL and anon key in <code>config.js</code>, and that the RLS policies ran.</div>`;
    return;
  }
  if (!ME || !PLAYERS.find(p => p.id === ME)) {
    document.getElementById("tabs").style.display = "none";
    renderGate();
  } else {
    // load this player's saved theme prefs and apply
    const me = PLAYERS.find(p => p.id === ME);
    MY_PREFS = me && me.prefs ? (typeof me.prefs === "string" ? JSON.parse(me.prefs) : me.prefs) : null;
    applyTheme(MY_PREFS);
    document.getElementById("tabs").style.display = "flex";
    wireTabs();
    routeTab();
  }
}

let CURRENT_TAB = "week";
function wireTabs() {
  document.querySelectorAll(".tab").forEach(t => {
    t.onclick = () => {
      CURRENT_TAB = t.dataset.tab;
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
      routeTab();
    };
  });
}
function routeTab() {
  app.innerHTML = `<div class="center-msg">Loading…</div>`;
  if (CURRENT_TAB === "field") renderField();
  else if (CURRENT_TAB === "standings") renderStandings();
  else if (CURRENT_TAB === "award") renderAward();
  else renderWeek();
}

// ============================================================
//  Live-ish refresh: re-render current tab on focus + light poll,
//  but never while the user is mid-edit (typing / placing board).
// ============================================================
function userIsBusy() {
  // don't refresh while editing the board, an input/select is focused,
  // an entry is being renamed, or a modal is open
  if (BOARD_EDIT_MODE) return true;
  const ae = document.activeElement;
  if (ae && (ae.tagName === "INPUT" || ae.tagName === "SELECT" || ae.tagName === "TEXTAREA")) return true;
  if (document.querySelector(".modal-overlay")) return true;
  if (document.querySelector("input.pid-edit")) return true;
  // on the pick screen, don't clobber unsaved in-progress selections.
  // Safe to refresh if the player has already submitted (screen just re-shows saved picks).
  if (CURRENT_TAB === "week" && window._pickScreenActive && !window._iAlreadySubmitted) {
    const picksSelects = document.querySelectorAll("select.team");
    if (Array.from(picksSelects).some(s => s.value)) return true;
  }
  return false;
}

let _refreshing = false;
async function safeRefresh() {
  if (_refreshing || userIsBusy()) return;
  if (document.hidden) return;
  if (!ME) return;                        // not signed in
  _refreshing = true;
  try {
    // re-render the current tab WITHOUT the "Loading…" flash
    if (CURRENT_TAB === "field") await renderField();
    else if (CURRENT_TAB === "standings") await renderStandings();
    else if (CURRENT_TAB === "award") await renderAward();
    else await renderWeek();
  } catch (e) {
    // silent — a failed background refresh shouldn't disrupt anything
  } finally {
    _refreshing = false;
  }
}

// refresh when the tab regains focus (someone picks their phone back up)
window.addEventListener("visibilitychange", () => { if (!document.hidden) safeRefresh(); });
window.addEventListener("focus", safeRefresh);

// gentle poll every 20s while the tab is visible
setInterval(() => { if (!document.hidden) safeRefresh(); }, 20000);

boot();
</script>
