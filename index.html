<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Winless</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="config.js"></script>
<style>
  :root {
    --bg:        #0b0e13;   /* stadium at night */
    --panel:     #131820;
    --panel-2:   #1a2029;
    --line:      #262e3a;
    --ink:       #eef2f7;
    --ink-dim:   #8b97a8;
    --ink-faint: #5a6472;
    --alert:     #ff4d3d;   /* single alert accent — losing team red */
    --alert-dim: #b8352a;
    --live:      #35d07f;    /* submitted / alive */
    --gold:      #f5c451;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }

  body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,77,61,0.08), transparent 60%);
    padding: 0 20px 80px;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  /* ---- Masthead ---- */
  header {
    padding: 34px 0 26px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 0.14em;
    line-height: 0.9;
    text-transform: uppercase;
  }
  .brand .x { color: var(--alert); }
  .tagline {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 6px;
  }
  .whoami {
    text-align: right;
    font-size: 12px;
    color: var(--ink-dim);
    line-height: 1.5;
  }
  .whoami b { color: var(--ink); font-weight: 600; }
  .whoami a {
    color: var(--ink-faint);
    text-decoration: none;
    border-bottom: 1px dashed var(--ink-faint);
    cursor: pointer;
    font-size: 11px;
  }
  .whoami a:hover { color: var(--alert); border-color: var(--alert); }

  /* ---- Name select ---- */
  .gate { padding-top: 60px; text-align: center; }
  .gate h2 {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: 24px;
    font-weight: 600;
  }
  .name-grid {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .name-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 22px 40px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform .12s, border-color .12s, background .12s;
  }
  .name-btn:hover {
    border-color: var(--alert);
    background: var(--panel-2);
    transform: translateY(-2px);
  }

  /* ---- Week header ---- */
  .weekbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 22px;
  }
  .weekbar .wk {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .stat {
    text-align: center;
    padding: 0 4px;
  }
  .stat .num {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--alert);
    line-height: 1;
  }
  .stat .lbl {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .weekbar .stats { display: flex; gap: 22px; }

  /* ---- Submission tracker ---- */
  .tracker {
    display: flex;
    gap: 10px;
    margin-bottom: 26px;
  }
  .chip {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    font-family: 'Barlow Semi Condensed', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .chip .nm { font-size: 16px; font-weight: 600; }
  .chip .st { font-size: 10px; letter-spacing: 0.14em; margin-top: 3px; color: var(--ink-faint); }
  .chip.in { border-color: var(--live); }
  .chip.in .st { color: var(--live); }
  .chip.wait .st { color: var(--gold); }

  /* ---- Pick builder ---- */
  .section-title {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 12px 2px;
    font-weight: 600;
  }
  .hint { font-size: 12px; color: var(--ink-faint); margin: 0 0 18px 2px; line-height: 1.5; }

  .rank-list { display: flex; flex-direction: column; gap: 8px; }
  .slot {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .slot .rk {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--ink-faint);
    width: 34px;
    text-align: center;
    flex-shrink: 0;
  }
  .slot:first-child .rk { color: var(--alert); }
  .slot .pts {
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    width: 44px;
    flex-shrink: 0;
    text-align: right;
  }
  select.team {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  select.team:focus { outline: none; border-color: var(--alert); }
  select.team.empty { color: var(--ink-faint); }

  .submitbar { margin-top: 26px; display: flex; gap: 12px; align-items: center; }
  .btn {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 15px 30px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: transform .1s, background .12s;
  }
  .btn-primary { background: var(--alert); color: #fff; }
  .btn-primary:hover { background: #ff6152; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--panel-2); color: var(--ink-faint); cursor: not-allowed; transform: none; }
  .msg { font-size: 13px; color: var(--ink-dim); }
  .msg.ok { color: var(--live); }
  .msg.err { color: var(--alert); }

  .locked-note {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--live);
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 14px;
    color: var(--ink-dim);
    line-height: 1.55;
  }
  .locked-note b { color: var(--ink); }

  .setup-warn {
    background: rgba(255,77,61,0.08);
    border: 1px solid var(--alert-dim);
    border-radius: 10px;
    padding: 18px 20px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    margin-top: 40px;
  }
  .setup-warn code { background: var(--panel-2); padding: 2px 6px; border-radius: 4px; font-size: 13px; }

  .center-msg { text-align: center; color: var(--ink-dim); padding: 60px 0; font-size: 14px; }

  /* ---- Tabs ---- */
  .tabs {
    display: flex; gap: 4px; margin-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    background: transparent; border: none; color: var(--ink-dim);
    font-family: 'Barlow Semi Condensed', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 12px 18px;
    cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .12s, border-color .12s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--alert); }

  /* ---- Field: import ---- */
  .import-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 22px;
  }
  .import-box h3 {
    font-family: 'Barlow Semi Condensed', sans-serif; font-size: 13px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim);
    font-weight: 600; margin-bottom: 8px;
  }
  .import-box p { font-size: 12px; color: var(--ink-faint); line-height: 1.55; margin-bottom: 12px; }
  textarea.paste {
    width: 100%; min-height: 120px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; color: var(--ink); font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 12px; padding: 12px; resize: vertical; line-height: 1.5;
  }
  textarea.paste:focus { outline: none; border-color: var(--alert); }
  .import-actions { display: flex; gap: 12px; align-items: center; margin-top: 12px; }

  /* ---- Field: intel ---- */
  .field-stats { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .fstat {
    flex: 1; min-width: 120px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px;
  }
  .fstat .n {
    font-family: 'Barlow Semi Condensed', sans-serif; font-size: 26px; font-weight: 700;
    color: var(--alert); line-height: 1;
  }
  .fstat .l { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin-top: 5px; }

  .field-week-sel {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  .field-week-sel label { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.08em; text-transform: uppercase; }
  select.wksel {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
    font-family: 'Inter', sans-serif; font-size: 14px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
  }

  .heat-table {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  .heat-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  .heat-row:last-child { border-bottom: none; }
  .heat-row .team {
    width: 130px; font-weight: 600; font-size: 14px; flex-shrink: 0;
  }
  .heat-row .team small { color: var(--ink-faint); font-weight: 400; display:block; font-size: 11px; }
  .heat-bar-wrap { flex: 1; height: 22px; background: var(--panel-2); border-radius: 5px; overflow: hidden; position: relative; }
  .heat-bar {
    height: 100%; background: linear-gradient(90deg, var(--alert-dim), var(--alert));
    border-radius: 5px; min-width: 2px; transition: width .5s ease;
  }
  .heat-row .pct {
    width: 74px; text-align: right; font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 700; font-size: 15px; flex-shrink: 0;
  }
  .heat-row .pct small { font-size: 10px; color: var(--ink-faint); font-weight: 400; display: block; }
  .heat-row.contrarian .team::after {
    content: "OPEN"; display: inline-block; margin-left: 6px; font-size: 9px;
    letter-spacing: 0.1em; color: var(--live); border: 1px solid var(--live);
    border-radius: 4px; padding: 0 4px; vertical-align: middle;
  }

  .field-note {
    font-size: 12px; color: var(--ink-faint); margin: 8px 2px 20px; line-height: 1.5;
  }

  /* ---- Standings ---- */
  .standings-table {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    margin-bottom: 24px;
  }
  .st-head, .st-row {
    display: grid; grid-template-columns: 40px 1fr 90px 90px 80px; align-items: center;
    gap: 10px; padding: 14px 18px;
  }
  .st-head {
    border-bottom: 1px solid var(--line);
    font-family: 'Barlow Semi Condensed', sans-serif; font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-faint); font-weight: 600;
  }
  .st-row { border-bottom: 1px solid var(--line); }
  .st-row:last-child { border-bottom: none; }
  .st-row.leader { background: linear-gradient(90deg, rgba(245,196,81,0.08), transparent); }
  .st-rank {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px;
    color: var(--ink-faint); text-align: center;
  }
  .st-row.leader .st-rank { color: var(--gold); }
  .st-name {
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 18px;
    letter-spacing: 0.04em;
  }
  .st-name small { display: block; font-family: 'Inter'; font-weight: 400; font-size: 11px; color: var(--ink-faint); letter-spacing: 0; margin-top: 1px; }
  .st-val {
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 20px;
  }
  .st-val small { font-size: 11px; color: var(--ink-faint); font-weight: 400; }
  .st-pct { color: var(--live); }

  .st-weekly { margin-top: 8px; }
  .st-weekly h3, .st-section-title {
    font-family: 'Barlow Semi Condensed', sans-serif; font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--ink-dim); font-weight: 600; margin: 0 0 12px 2px;
  }
  .wk-grid {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto;
  }
  .wk-grid table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .wk-grid th, .wk-grid td {
    padding: 9px 12px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  .wk-grid th {
    font-family: 'Barlow Semi Condensed', sans-serif; font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint); font-weight: 600;
  }
  .wk-grid td.name { text-align: left; font-weight: 600; }
  .wk-grid td .rec { color: var(--ink); }
  .wk-grid td .cf { color: var(--ink-faint); font-size: 11px; }
  .wk-grid tr:last-child td { border-bottom: none; }

  /* ---- Lock button ---- */
  .lockbar {
    margin: 22px 0 4px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .lockbar .lbltxt { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .lockbar .lbltxt b { color: var(--ink); }
  .btn-lock { background: var(--gold); color: #1a1200; white-space: nowrap; }
  .btn-lock:hover { background: #ffd166; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--line); color: var(--ink-dim);
    font-size: 12px; padding: 9px 16px; letter-spacing: 0.08em;
  }
  .btn-ghost:hover { border-color: var(--alert); color: var(--alert); }

  /* ---- Layout: board + ranking ---- */
  .reveal-grid {
    display: grid;
    grid-template-columns: 1fr 260px;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 640px) {
    .reveal-grid { grid-template-columns: 1fr; }
  }

  /* ---- Aggregate ranking (standings table) ---- */
  .ranking {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    position: sticky;
    top: 16px;
  }
  .ranking h3 {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-dim); font-weight: 600;
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line);
  }
  .rank-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .rank-row:last-child { border-bottom: none; }
  .rank-row .pos {
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700;
    color: var(--ink-faint); width: 20px; font-size: 13px;
  }
  .rank-row.top6 .pos { color: var(--alert); }
  .rank-row .tm { flex: 1; font-weight: 600; }
  .rank-row .tm small { display:block; font-weight:400; color: var(--ink-faint); font-size: 11px; margin-top: 1px; }
  .rank-row .tp {
    font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700;
    font-size: 16px; color: var(--ink);
  }
  .rank-row .tp small { font-size: 10px; color: var(--ink-faint); font-weight: 400; }
  .rank-divider {
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-faint); text-align: center; padding: 5px;
    background: var(--panel-2); border-bottom: 1px solid var(--line);
  }

  /* ---- Entry board ---- */
  .board { display: flex; flex-direction: column; gap: 10px; }
  .entry-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .entry-card.dead { opacity: 0.5; }
  .entry-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .entry-head .id {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .entry-head .status-tag {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 20px; font-weight: 600;
  }
  .status-tag.alive { background: rgba(53,208,127,0.14); color: var(--live); }
  .status-tag.dead  { background: rgba(255,77,61,0.14); color: var(--alert); }
  .entry-assign { display: flex; align-items: center; gap: 10px; }
  select.entry-team {
    flex: 1; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--ink); font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500;
    padding: 9px 10px; border-radius: 8px; cursor: pointer; -webkit-appearance: none; appearance: none;
  }
  select.entry-team:focus { outline: none; border-color: var(--alert); }
  select.entry-team.unset { color: var(--ink-faint); }
  select.entry-team option:disabled { color: var(--ink-faint); }
  .entry-used {
    margin-top: 9px; font-size: 11px; color: var(--ink-faint); line-height: 1.5;
  }
  .entry-used b { color: var(--ink-dim); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; }
  .used-pill {
    display: inline-block; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 5px; padding: 1px 6px; margin: 2px 3px 0 0; color: var(--ink-dim); font-size: 11px;
  }
  .board-actions { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">WINLE<span class="x">SS</span></div>
      <div class="tagline">NFL Loser Pool — one crew, six entries</div>
    </div>
    <div class="whoami" id="whoami"></div>
  </header>

  <nav id="tabs" class="tabs" style="display:none">
    <button class="tab active" data-tab="week">This Week</button>
    <button class="tab" data-tab="standings">Standings</button>
    <button class="tab" data-tab="field">Field</button>
  </nav>

  <main id="app"><div class="center-msg">Loading…</div></main>
</div>

<script>
// ============================================================
//  Winless — steps 1 & 2: name select + pick submission
// ============================================================

const CFG = window.WINLESS_CONFIG || {};
const SB_URL = (CFG.SUPABASE_URL || "").replace(/\/$/, "");
const SB_KEY = CFG.SUPABASE_ANON_KEY || "";
const CONFIGURED = SB_URL && SB_KEY && !SB_URL.includes("PASTE_") && !SB_KEY.includes("PASTE_");

// NFL teams — abbrev + display
const TEAMS = [
  ["ARI","Arizona Cardinals"],["ATL","Atlanta Falcons"],["BAL","Baltimore Ravens"],
  ["BUF","Buffalo Bills"],["CAR","Carolina Panthers"],["CHI","Chicago Bears"],
  ["CIN","Cincinnati Bengals"],["CLE","Cleveland Browns"],["DAL","Dallas Cowboys"],
  ["DEN","Denver Broncos"],["DET","Detroit Lions"],["GB","Green Bay Packers"],
  ["HOU","Houston Texans"],["IND","Indianapolis Colts"],["JAX","Jacksonville Jaguars"],
  ["KC","Kansas City Chiefs"],["LV","Las Vegas Raiders"],["LAC","Los Angeles Chargers"],
  ["LAR","Los Angeles Rams"],["MIA","Miami Dolphins"],["MIN","Minnesota Vikings"],
  ["NE","New England Patriots"],["NO","New Orleans Saints"],["NYG","New York Giants"],
  ["NYJ","New York Jets"],["PHI","Philadelphia Eagles"],["PIT","Pittsburgh Steelers"],
  ["SF","San Francisco 49ers"],["SEA","Seattle Seahawks"],["TB","Tampa Bay Buccaneers"],
  ["TEN","Tennessee Titans"],["WAS","Washington Commanders"],
];
const TEAM_NAME = Object.fromEntries(TEAMS.map(t => [t[0], t[1]]));

// ---- Supabase REST helpers ----
async function sb(path, opts = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      "Content-Type": "application/json",
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    const body = await res.text();
    throw new Error(`${res.status}: ${body}`);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
const sbGet = (path) => sb(path, { method: "GET" });
const sbUpsert = (table, rows, onConflict) =>
  sb(`${table}${onConflict ? `?on_conflict=${onConflict}` : ""}`, {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(rows),
  });

// ---- Pick submission screen ----
async function renderWeek() {
  renderWhoami();

  // current open week = highest week_number with status 'open', else highest overall
  const weeks = await sbGet("weeks?order=week_number.desc&limit=1");
  if (!weeks || !weeks.length) {
    app.innerHTML = `<div class="center-msg">No week has been opened yet.<br>
      The commissioner needs to add a row to <b>weeks</b> to start.</div>`;
    return;
  }
  const wk = weeks[0];
  const picksReq = wk.picks_required;

  // existing submission + picks for me this week
  const [subs, myPicks] = await Promise.all([
    sbGet(`submissions?week_number=eq.${wk.week_number}`),
    sbGet(`picks?week_number=eq.${wk.week_number}&player_id=eq.${ME}&order=rank.asc`),
  ]);

  const submittedBy = new Set(subs.filter(s => s.submitted).map(s => s.player_id));
  const iSubmitted = submittedBy.has(ME);
  const allIn = PLAYERS.length > 0 && PLAYERS.every(p => submittedBy.has(p.id));

  // week stat bar + tracker
  const trackerHtml = PLAYERS.map(p => {
    const inYet = submittedBy.has(p.id);
    return `<div class="chip ${inYet ? "in" : "wait"}">
        <div class="nm">${p.name}</div>
        <div class="st">${inYet ? "✓ In" : "Waiting"}</div>
      </div>`;
  }).join("");

  const headerHtml = `
    <div class="weekbar">
      <div class="wk">Week ${wk.week_number}</div>
      <div class="stats">
        <div class="stat"><div class="num">${wk.entries_remaining}</div><div class="lbl">Entries</div></div>
        <div class="stat"><div class="num">${picksReq}</div><div class="lbl">Picks Each</div></div>
      </div>
    </div>
    <div class="tracker">${trackerHtml}</div>`;

  if (wk.status === "locked" || wk.status === "resolved") {
    await renderBoard(wk, headerHtml);
    return;
  }

  // build the ranked slots, pre-filled if I already have picks
  const existing = {};
  myPicks.forEach(p => { existing[p.rank] = p.team; });

  let slots = "";
  for (let r = 1; r <= picksReq; r++) {
    const pts = picksReq - r + 1;
    const chosen = existing[r] || "";
    const opts = [`<option value="" ${chosen ? "" : "selected"}>— pick a team —</option>`]
      .concat(TEAMS.map(([ab, nm]) =>
        `<option value="${ab}" ${chosen === ab ? "selected" : ""}>${nm}</option>`)).join("");
    slots += `
      <div class="slot">
        <div class="rk">${r}</div>
        <select class="team ${chosen ? "" : "empty"}" data-rank="${r}">${opts}</select>
        <div class="pts">${pts} pt${pts !== 1 ? "s" : ""}</div>
      </div>`;
  }

  app.innerHTML = headerHtml + `
    <div class="section-title">Your ranked losers — most confident at the top</div>
    <p class="hint">Pick ${picksReq} different teams you think will lose this week, ranked by confidence.
      Rank 1 is worth ${picksReq} points, down to 1 point at the bottom. Your points get summed with
      Tyler's and Kurt's to build the master ranking${iSubmitted ? " — resubmit any time before lock to change your list." : "."}</p>
    <div class="rank-list">${slots}</div>
    <div class="submitbar">
      <button class="btn btn-primary" id="submit">${iSubmitted ? "Update my list" : "Submit my list"}</button>
      <span class="msg" id="msg"></span>
    </div>
    ${allIn ? `
      <div class="lockbar">
        <div class="lbltxt"><b>All three lists are in.</b> Lock the week to reveal the master
          ranking and start placing entries. Once locked, picks are final.</div>
        <button class="btn btn-lock" id="lockweek">Lock week &amp; reveal</button>
      </div>` : ""}`;

  // prevent picking the same team twice — live dedupe styling
  const selects = () => Array.from(app.querySelectorAll("select.team"));
  function refreshDupes() {
    const chosen = selects().map(s => s.value).filter(Boolean);
    const counts = {};
    chosen.forEach(v => counts[v] = (counts[v] || 0) + 1);
    selects().forEach(s => {
      s.classList.toggle("empty", !s.value);
      s.style.borderColor = (s.value && counts[s.value] > 1) ? "var(--alert)" : "";
    });
  }
  selects().forEach(s => s.onchange = refreshDupes);
  refreshDupes();

  document.getElementById("submit").onclick = () => submitPicks(wk, picksReq);
  const lockBtn = document.getElementById("lockweek");
  if (lockBtn) lockBtn.onclick = () => lockWeek(wk);
}

async function submitPicks(wk, picksReq) {
  const msg = document.getElementById("msg");
  msg.className = "msg";
  msg.textContent = "";

  const selects = Array.from(app.querySelectorAll("select.team"));
  const chosen = selects.map(s => ({ rank: +s.dataset.rank, team: s.value }));

  // validate
  const empties = chosen.filter(c => !c.team);
  if (empties.length) {
    msg.className = "msg err";
    msg.textContent = `Fill all ${picksReq} slots — ${empties.length} still empty.`;
    return;
  }
  const teams = chosen.map(c => c.team);
  if (new Set(teams).size !== teams.length) {
    msg.className = "msg err";
    msg.textContent = "No repeats — each slot needs a different team.";
    return;
  }

  const btn = document.getElementById("submit");
  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "Saving…";

  try {
    // clear my existing picks for this week, then insert fresh
    await sb(`picks?week_number=eq.${wk.week_number}&player_id=eq.${ME}`, { method: "DELETE" });
    const rows = chosen.map(c => ({
      week_number: wk.week_number, player_id: ME, team: c.team, rank: c.rank,
    }));
    await sb("picks", { method: "POST", body: JSON.stringify(rows) });
    await sbUpsert("submissions",
      [{ week_number: wk.week_number, player_id: ME, submitted: true }],
      "week_number,player_id");

    msg.className = "msg ok";
    msg.textContent = "Locked in ✓";
    setTimeout(renderWeek, 700);
  } catch (e) {
    btn.disabled = false;
    msg.className = "msg err";
    msg.textContent = "Save failed: " + e.message;
  }
}

// ---- Lock the week ----
async function lockWeek(wk) {
  const btn = document.getElementById("lockweek");
  if (btn) { btn.disabled = true; btn.textContent = "Locking…"; }
  try {
    await sb(`weeks?week_number=eq.${wk.week_number}`, {
      method: "PATCH", body: JSON.stringify({ status: "locked" }),
    });
    renderWeek();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = "Lock week & reveal"; }
    alert("Couldn't lock: " + e.message);
  }
}

// ---- Compute aggregate ranking from all picks this week ----
// team -> { points, voters:[{player,rank,pts}] }.  rank r on a list of N = (N - r + 1) points.
function computeAggregate(allPicks, picksReq) {
  const map = {};
  allPicks.forEach(p => {
    const pts = picksReq - p.rank + 1;
    if (!map[p.team]) map[p.team] = { team: p.team, points: 0, voters: [] };
    map[p.team].points += pts;
    map[p.team].voters.push({ player: p.player_id, rank: p.rank, pts });
  });
  return Object.values(map).sort((a, b) =>
    b.points - a.points || a.team.localeCompare(b.team));
}

// ---- Reveal + entry board ----
async function renderBoard(wk, headerHtml) {
  const [allPicks, entries, assigns] = await Promise.all([
    sbGet(`picks?week_number=eq.${wk.week_number}`),
    sbGet(`entries?order=id.asc`),
    sbGet(`assignments?order=week_number.asc`),
  ]);

  const agg = computeAggregate(allPicks, wk.picks_required);
  const aggRank = {}; agg.forEach((a, i) => aggRank[a.team] = i + 1);

  // per-entry used teams = every team this entry was assigned in PRIOR weeks
  const usedByEntry = {};
  entries.forEach(e => usedByEntry[e.id] = new Set());
  assigns.forEach(a => {
    if (a.week_number < wk.week_number) usedByEntry[a.entry_id]?.add(a.team);
  });

  // this week's existing assignments (to prefill the board)
  const thisWeek = {};
  assigns.filter(a => a.week_number === wk.week_number)
         .forEach(a => thisWeek[a.entry_id] = a.team);

  const playerName = id => (PLAYERS.find(p => p.id === id)?.name || id);

  // ranking panel
  let rankRows = "";
  agg.forEach((a, i) => {
    if (i === 6) rankRows += `<div class="rank-divider">— cutline —</div>`;
    const voters = a.voters
      .sort((x, y) => x.rank - y.rank)
      .map(v => `${playerName(v.player)} #${v.rank}`).join(" · ");
    rankRows += `
      <div class="rank-row ${i < 6 ? "top6" : ""}">
        <div class="pos">${i + 1}</div>
        <div class="tm">${TEAM_NAME[a.team] || a.team}<small>${voters}</small></div>
        <div class="tp">${a.points}<small> pt</small></div>
      </div>`;
  });
  if (!agg.length) rankRows = `<div class="rank-row"><div class="tm" style="color:var(--ink-faint)">No picks submitted.</div></div>`;

  const rankingHtml = `
    <div class="ranking">
      <h3>Master Ranking</h3>
      ${rankRows}
    </div>`;

  // team dropdown options for an entry — disable teams this entry already used
  function teamOptions(entryId, selected) {
    const used = usedByEntry[entryId] || new Set();
    const opts = [`<option value="" ${selected ? "" : "selected"}>— assign a team —</option>`];
    // sort by aggregate rank so best picks float to the top of the list
    const ordered = [...TEAMS].sort((a, b) =>
      (aggRank[a[0]] || 99) - (aggRank[b[0]] || 99) || a[1].localeCompare(b[1]));
    ordered.forEach(([ab, nm]) => {
      const isUsed = used.has(ab);
      const rk = aggRank[ab] ? `#${aggRank[ab]}` : "";
      opts.push(`<option value="${ab}" ${selected === ab ? "selected" : ""} ${isUsed ? "disabled" : ""}>
        ${nm}${rk ? "  " + rk : ""}${isUsed ? "  (used)" : ""}</option>`);
    });
    return opts.join("");
  }

  // board of entries
  let boardHtml = "";
  entries.forEach(e => {
    const dead = e.status === "dead";
    const used = [...(usedByEntry[e.id] || [])];
    const sel = thisWeek[e.id] || "";
    boardHtml += `
      <div class="entry-card ${dead ? "dead" : ""}">
        <div class="entry-head">
          <div class="id">${e.label || "Entry " + e.id}</div>
          <div class="status-tag ${dead ? "dead" : "alive"}">${dead ? "Eliminated" : "Alive"}</div>
        </div>
        ${dead ? `<div class="entry-used">Knocked out in Week ${e.died_week ?? "?"}.</div>` : `
          <div class="entry-assign">
            <select class="entry-team ${sel ? "" : "unset"}" data-entry="${e.id}">
              ${teamOptions(e.id, sel)}
            </select>
          </div>
          <div class="entry-used">
            <b>Used:</b> ${used.length
              ? used.map(t => `<span class="used-pill">${t}</span>`).join("")
              : `<span style="color:var(--ink-faint)">none yet</span>`}
          </div>`}
      </div>`;
  });

  app.innerHTML = headerHtml + `
    <div class="lockbar" style="margin-bottom:18px">
      <div class="lbltxt"><b>Week ${wk.week_number} locked.</b> Place teams on the live entries below.
        A team can go on more than one entry; an entry can't reuse a team it already played.</div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        <button class="btn btn-ghost" id="resolvenow">Resolve now</button>
        <button class="btn btn-ghost" id="unlock">Unlock</button>
      </div>
    </div>
    <div class="reveal-grid">
      <div>
        <div class="section-title">Entry Board</div>
        <div class="board">${boardHtml}</div>
        <div class="board-actions">
          <button class="btn btn-primary" id="saveboard">Save assignments</button>
          <span class="msg" id="boardmsg"></span>
        </div>
      </div>
      ${rankingHtml}
    </div>`;

  app.querySelectorAll("select.entry-team").forEach(s => {
    s.onchange = () => s.classList.toggle("unset", !s.value);
  });
  document.getElementById("saveboard").onclick = () => saveBoard(wk);
  document.getElementById("resolvenow").onclick = async (e) => {
    const b = e.target;
    b.disabled = true; const orig = b.textContent; b.textContent = "Checking…";
    try {
      const res = await fetch("/.netlify/functions/resolve-now");
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "failed");
      const changed = (data.report || []).reduce((n, r) => n + (r.changed || 0), 0);
      b.textContent = changed ? `Updated ${changed}` : "No new finals";
      setTimeout(() => renderWeek(), 1200);
    } catch (err) {
      b.disabled = false; b.textContent = orig;
      alert("Resolve failed: " + err.message);
    }
  };
  document.getElementById("unlock").onclick = async () => {
    if (!confirm("Unlock the week? This lets everyone edit their lists again.")) return;
    await sb(`weeks?week_number=eq.${wk.week_number}`, {
      method: "PATCH", body: JSON.stringify({ status: "open" }),
    });
    renderWeek();
  };
}

async function saveBoard(wk) {

  msg.className = "msg"; msg.textContent = "Saving…";

// Map loose team names/abbreviations -> canonical abbrev.
const TEAM_ALIASES = (() => {
  const m = {};
  TEAMS.forEach(([ab, nm]) => {
    m[ab.toUpperCase()] = ab;
    m[nm.toUpperCase()] = ab;
    m[nm.split(" ").pop().toUpperCase()] = ab; // last word = mascot (Cowboys, Titans)
  });
  // common extras / alt spellings
  Object.assign(m, {
    "AZ": "ARI", "ARIZONA": "ARI", "CARDINALS": "ARI",
    "JAC": "JAX", "JAGS": "JAX", "WFT": "WAS", "COMMANDERS": "WAS", "WASHINGTON": "WAS",
    "NINERS": "SF", "49ERS": "SF", "SF": "SF",
    "LA": "LAR", "RAMS": "LAR", "CHARGERS": "LAC", "BOLTS": "LAC",
    "JETS": "NYJ", "GIANTS": "NYG", "GMEN": "NYG",
    "TAMPA": "TB", "BUCS": "TB", "BUCCANEERS": "TB",
    "PATS": "NE", "PATRIOTS": "NE", "NINER": "SF",
  });
  return m;
})();

function normTeam(raw) {
  if (!raw) return null;
  const key = String(raw).trim().toUpperCase();
  if (!key || key === "X") return null;
  if (TEAM_ALIASES[key]) return TEAM_ALIASES[key];
  // strip @ and location prefixes like "@CIN"
  const stripped = key.replace(/[^A-Z0-9]/g, "");
  if (TEAM_ALIASES[stripped]) return TEAM_ALIASES[stripped];
  return null; // unrecognized -> caller can flag
}

// Parse a pasted grid: first row = header (NAME, WEEK 1, WEEK 2, ...),
// each following row = entrant name then one team per week. Tolerant of
// tabs or 2+ spaces or commas as delimiters, blank cells, and stray markers.
function parseFieldPaste(text) {
  const lines = text.split(/\r?\n/).map(l => l.replace(/\s+$/,"")).filter(l => l.trim());
  if (!lines.length) return { rows: [], weeks: 0, unknown: [] };

  const splitRow = (line) => {
    if (line.includes("\t")) return line.split("\t");
    if (line.includes(",")) return line.split(",");
    return line.split(/\s{2,}/); // 2+ spaces — least reliable; tab/comma preferred
  };

  // detect delimiter for a warning if it's the unreliable space fallback
  const usesReliableDelim = lines.some(l => l.includes("\t") || l.includes(","));

  // detect + skip a header row if it starts with NAME
  let start = 0;
  const first = splitRow(lines[0]).map(c => c.trim().toUpperCase());
  if (first[0] === "NAME" || first[0] === "ENTRY" || first[0].startsWith("WEEK")) start = 1;

  const rows = [];
  const unknown = new Set();
  let maxWeeks = 0;

  for (let i = start; i < lines.length; i++) {
    const cells = splitRow(lines[i]).map(c => c.trim());
    if (!cells.length) continue;
    const name = cells[0].replace(/\*+$/,"").trim(); // drop trailing * markers
    if (!name) continue;
    const picks = [];
    for (let w = 1; w < cells.length; w++) {
      const t = normTeam(cells[w]);
      if (cells[w] && cells[w].trim() && !t) unknown.add(cells[w].trim());
      picks.push(t); // null = no pick / eliminated that week
    }
    maxWeeks = Math.max(maxWeeks, picks.length);
    rows.push({ name, picks });
  }
  return { rows, weeks: maxWeeks, unknown: [...unknown], usesReliableDelim };
}

// Aliases (FOXY 1, FOXY 2) share an owner = name minus trailing number.
function ownerOf(entryName) {
  return entryName.replace(/\s+\d+$/,"").trim();
}

function wireFieldImport(curWeek) {
  const btn = document.getElementById("doimport");
  if (btn) btn.onclick = () => doFieldImport(curWeek);

async function doFieldImport(curWeek) {
  const msg = document.getElementById("importmsg");
  const text = document.getElementById("paste").value;
  const parsed = parseFieldPaste(text);
  if (!parsed.rows.length) {
    msg.className = "msg err"; msg.textContent = "Couldn't find any rows — check the paste.";
    return;
  }
  const btn = document.getElementById("doimport");
  btn.disabled = true;
  msg.className = "msg"; msg.textContent = "Importing…";

  // upsert one row per entry: { entry_name, owner, picks(json) }
  const rows = parsed.rows.map(r => ({
    entry_name: r.name,
    owner: ownerOf(r.name),
    picks: JSON.stringify(r.picks),
  }));

  try {
    // replace the whole field snapshot
    await sb("field_picks?entry_name=neq.__none__", { method: "DELETE" });
    await sb("field_picks", { method: "POST", body: JSON.stringify(rows) });
    let note = `Imported ${parsed.rows.length} entries across ${parsed.weeks} week${parsed.weeks!==1?"s":""}.`;
    if (!parsed.usesReliableDelim) note += ` Heads up: no tabs/commas detected — used space-splitting, which can misread names with spaces. If picks look wrong, paste from the site's copy (usually tab-separated) or use a CSV.`;
    if (parsed.unknown.length) note += ` Unrecognized: ${parsed.unknown.slice(0,8).join(", ")}${parsed.unknown.length>8?"…":""} (skipped).`;
    msg.className = "msg ok"; msg.textContent = note;
    setTimeout(() => renderField(), 900);
  } catch (e) {
    btn.disabled = false;
    msg.className = "msg err"; msg.textContent = "Import failed: " + e.message;
  }
}

function renderFieldIntel(field, week) {
  // hydrate picks
  const entries = field.map(f => ({
    name: f.entry_name, owner: f.owner,
    outWeek: f.out_week ?? null,
    picks: (() => { try { return JSON.parse(f.picks); } catch { return []; } })(),
  }));

  const maxWeeks = Math.max(1, ...entries.map(e => e.picks.length));
  const wIdx = week - 1;

  // alive this week = not eliminated before this week AND has a pick this week
  const aliveThisWeek = entries.filter(e =>
    (e.outWeek == null || e.outWeek >= week) && e.picks[wIdx]);
  const totalAlive = aliveThisWeek.length;

  // % on each team this week
  const counts = {};
  aliveThisWeek.forEach(e => {
    const t = e.picks[wIdx];
    if (t) counts[t] = (counts[t] || 0) + 1;
  });
  const heat = Object.entries(counts)
    .map(([team, n]) => ({ team, n, pct: totalAlive ? n / totalAlive : 0 }))
    .sort((a, b) => b.n - a.n);

  // owners & total entries; still-alive across the whole field (not week-specific)
  const owners = new Set(entries.map(e => e.owner));
  const stillAlive = entries.filter(e => e.outWeek == null).length;
  const anyResolved = entries.some(e => e.outWeek != null);

  const stats = `
    <div class="field-stats">
      <div class="fstat"><div class="n">${entries.length}</div><div class="l">Total Entries</div></div>
      <div class="fstat"><div class="n">${owners.size}</div><div class="l">Entrants</div></div>
      ${anyResolved ? `<div class="fstat"><div class="n">${stillAlive}</div><div class="l">Still Alive</div></div>` : ""}
      <div class="fstat"><div class="n">${totalAlive}</div><div class="l">On A Team Wk ${week}</div></div>
      <div class="fstat"><div class="n">${heat.length}</div><div class="l">Teams In Play</div></div>
    </div>`;

  const wkOptions = [];
  for (let w = 1; w <= maxWeeks; w++)
    wkOptions.push(`<option value="${w}" ${w === week ? "selected" : ""}>Week ${w}</option>`);

  const heatRows = heat.map(h => {
    const pctTxt = (h.pct * 100).toFixed(1);
    const contrarian = h.pct > 0 && h.pct <= 0.05; // <=5% of field = contrarian opening
    return `
      <div class="heat-row ${contrarian ? "contrarian" : ""}">
        <div class="team">${TEAM_NAME[h.team] || h.team}<small>${h.n} ${h.n === 1 ? "entry" : "entries"}</small></div>
        <div class="heat-bar-wrap"><div class="heat-bar" style="width:${Math.max(2, h.pct*100)}%"></div></div>
        <div class="pct">${pctTxt}%<small>of field</small></div>
      </div>`;
  }).join("");

  app.innerHTML = `
    ${fieldImportHtml("", null)}
    ${stats}
    <div class="field-week-sel">
      <label>Show week</label>
      <select class="wksel" id="wksel">${wkOptions.join("")}</select>
    </div>
    <div class="section-title">Field concentration — who's on what</div>
    <p class="field-note">How much of the surviving field is riding each team this week. High % = chalk
      (safe but crowded); <span style="color:var(--live)">OPEN</span> flags teams almost nobody's using —
      contrarian survival if you believe in them.</p>
    <div class="heat-table">${heatRows || '<div class="heat-row"><div class="team" style="color:var(--ink-faint)">No picks for this week yet.</div></div>'}</div>`;

  wireFieldImport(week);
  document.getElementById("wksel").onchange = (e) => renderFieldIntel(field, +e.target.value);
}

// ============================================================
//  STANDINGS TAB — how accurate each of us has been
// ============================================================
async function renderStandings() {
  renderWhoami();

  // all graded picks across the season
  const picks = await sbGet(`picks?order=week_number.asc`);
  if (!picks || !picks.length) {
    app.innerHTML = `<div class="center-msg">No picks submitted yet this season.</div>`;
    return;
  }

  // tally per player: record (correct/incorrect) + confidence (points on correct picks)
  // confidence points for a pick = (picks_required that week) - rank + 1.
  // We need each week's picks_required; fetch weeks once.
  const weeks = await sbGet(`weeks?order=week_number.asc`) || [];
  const reqByWeek = {}; weeks.forEach(w => reqByWeek[w.week_number] = w.picks_required);

  const tally = {}; // player -> {correct, incorrect, pending, conf}
  const weekly = {}; // player -> week -> {correct, incorrect, conf}
  PLAYERS.forEach(p => { tally[p.id] = { correct:0, incorrect:0, pending:0, conf:0 }; weekly[p.id] = {}; });

  picks.forEach(p => {
    if (!tally[p.player_id]) return;
    const req = reqByWeek[p.week_number] || 8;
    const pts = req - p.rank + 1;
    const t = tally[p.player_id];
    const wk = (weekly[p.player_id][p.week_number] ||= { correct:0, incorrect:0, conf:0 });
    if (p.result === "correct") { t.correct++; t.conf += pts; wk.correct++; wk.conf += pts; }
    else if (p.result === "incorrect") { t.incorrect++; wk.incorrect++; }
    else t.pending++;
  });

  // rank: most correct, then highest confidence (the pool's tiebreaker)
  const ranked = PLAYERS.map(p => ({
    id: p.id, name: p.name, ...tally[p.id],
    total: tally[p.id].correct + tally[p.id].incorrect,
    pct: (tally[p.id].correct + tally[p.id].incorrect)
       ? tally[p.id].correct / (tally[p.id].correct + tally[p.id].incorrect) : 0,
  })).sort((a,b) => b.correct - a.correct || b.conf - a.conf);

  const rows = ranked.map((r, i) => `
    <div class="st-row ${i===0 ? "leader" : ""}">
      <div class="st-rank">${i+1}</div>
      <div class="st-name">${r.name}${i===0 ? "<small>seeing the ball best</small>" : ""}</div>
      <div class="st-val">${r.correct}<small>-${r.incorrect}</small></div>
      <div class="st-val st-pct">${(r.pct*100).toFixed(0)}<small>%</small></div>
      <div class="st-val">${r.conf}</div>
    </div>`).join("");

  // weekly breakdown grid
  const playedWeeks = [...new Set(picks.map(p => p.week_number))].sort((a,b)=>a-b);
  const gridHead = `<tr><th class="name">Week</th>${ranked.map(r=>`<th>${r.name}</th>`).join("")}</tr>`;
  const gridBody = playedWeeks.map(wk => {
    const cells = ranked.map(r => {
      const w = weekly[r.id][wk];
      if (!w) return `<td><span class="cf">—</span></td>`;
      return `<td><span class="rec">${w.correct}-${w.incorrect}</span><br><span class="cf">${w.conf} cf</span></td>`;
    }).join("");
    return `<tr><td class="name">Week ${wk}</td>${cells}</tr>`;
  }).join("");

  const anyPending = ranked.some(r => r.pending > 0);

  app.innerHTML = `
    <div class="st-section-title">Season Standings — pick accuracy</div>
    <div class="standings-table">
      <div class="st-head">
        <div style="text-align:center">#</div>
        <div>Player</div>
        <div>Record</div>
        <div>Accuracy</div>
        <div>Confidence</div>
      </div>
      ${rows}
    </div>
    <p class="field-note">Every team on your weekly list is graded: correct if it lost, incorrect if it won or tied.
      <b>Record</b> is your season correct–incorrect. <b>Confidence</b> sums the points you assigned to teams that
      actually lost (rank 1 on an 8-pick week = 8 points). Ranked by most correct, confidence breaks ties —
      the "seeing the ball best" leader.${anyPending ? " Some picks are still pending this week's results." : ""}</p>

    <div class="st-weekly">
      <div class="st-section-title">Week by week</div>
      <div class="wk-grid"><table>${gridHead}${gridBody}</table></div>
    </div>`;
}

// ---- Boot ----
async function boot() {
  if (!CONFIGURED) {
    whoami.innerHTML = "";
    app.innerHTML = `
      <div class="setup-warn">
        <b>Almost there.</b> Open <code>config.js</code> and paste your Supabase
        <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code>, then redeploy.
        Until then the app can't reach the backend.
      </div>`;
    return;
  }
  try {
    PLAYERS = await sbGet("players?order=id.asc");
  } catch (e) {
    app.innerHTML = `<div class="setup-warn"><b>Couldn't reach Supabase.</b><br>${e.message}
      <br><br>Check your URL and anon key in <code>config.js</code>, and that the RLS policies ran.</div>`;
    return;
  }
  if (!ME || !PLAYERS.find(p => p.id === ME)) {
    document.getElementById("tabs").style.display = "none";
    renderGate();
  } else {
    document.getElementById("tabs").style.display = "flex";
    wireTabs();
    routeTab();
  }
}

let CURRENT_TAB = "week";
function wireTabs() {
  document.querySelectorAll(".tab").forEach(t => {
    t.onclick = () => {
      CURRENT_TAB = t.dataset.tab;
      document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
      routeTab();
    };
  });
}
function routeTab() {
  app.innerHTML = `<div class="center-msg">Loading…</div>`;
  if (CURRENT_TAB === "field") renderField();
  else if (CURRENT_TAB === "standings") renderStandings();
  else renderWeek();
}

boot();
</script>
